name: iOS App Store Release Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build (full archive+upload), check (poll build processing status), or create-version (create App Store version + attach latest build)'
        type: choice
        options: [build, check, create-version]
        default: build

jobs:
  check-status:
    if: ${{ github.event.inputs.mode == 'check' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write App Store Connect API key
        run: echo "$ASC_API_KEY" > AuthKey.p8
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Generate JWT and query build status
        run: |
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const https = require('https');

          function base64url(buf) {
            return buf.toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          const header = { alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' };
          const now = Math.floor(Date.now() / 1000);
          const payload = { iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' };

          const headerB64 = base64url(Buffer.from(JSON.stringify(header)));
          const payloadB64 = base64url(Buffer.from(JSON.stringify(payload)));
          const signingInput = `${headerB64}.${payloadB64}`;

          const privateKey = fs.readFileSync('AuthKey.p8', 'utf8');
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: privateKey,
            dsaEncoding: 'ieee-p1363',
          });
          const jwt = `${signingInput}.${base64url(signature)}`;

          function apiGet(urlPath) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: 'api.appstoreconnect.apple.com',
                path: urlPath,
                headers: { Authorization: `Bearer ${jwt}` },
              }, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  if (res.statusCode >= 400) return reject(new Error(`HTTP ${res.statusCode}: ${data}`));
                  resolve(JSON.parse(data));
                });
              }).on('error', reject);
            });
          }

          (async () => {
            const appsResp = await apiGet('/v1/apps?filter[bundleId]=com.betelcode.app');
            const appId = appsResp.data[0].id;
            const buildsResp = await apiGet(`/v1/builds?filter[app]=${appId}&sort=-uploadedDate&limit=3`);
            for (const build of buildsResp.data) {
              console.log(`BUILD version=${build.attributes.version} state=${build.attributes.processingState} uploaded=${build.attributes.uploadedDate}`);
            }
          })().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          EOF
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Clean up secrets from disk
        if: always()
        run: rm -f AuthKey.p8

  create-version:
    if: ${{ github.event.inputs.mode == 'create-version' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write App Store Connect API key
        run: echo "$ASC_API_KEY" > AuthKey.p8
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Create 4.7.0 App Store version and attach latest build
        run: |
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const https = require('https');

          const VERSION_STRING = '4.7.0';

          function base64url(buf) {
            return buf.toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          const header = { alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' };
          const now = Math.floor(Date.now() / 1000);
          const payload = { iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' };
          const headerB64 = base64url(Buffer.from(JSON.stringify(header)));
          const payloadB64 = base64url(Buffer.from(JSON.stringify(payload)));
          const signingInput = `${headerB64}.${payloadB64}`;
          const privateKey = fs.readFileSync('AuthKey.p8', 'utf8');
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: privateKey,
            dsaEncoding: 'ieee-p1363',
          });
          const jwt = `${signingInput}.${base64url(signature)}`;

          function apiRequest(method, urlPath, body) {
            return new Promise((resolve, reject) => {
              const payloadStr = body ? JSON.stringify(body) : null;
              const req = https.request({
                hostname: 'api.appstoreconnect.apple.com',
                path: urlPath,
                method,
                headers: {
                  Authorization: `Bearer ${jwt}`,
                  'Content-Type': 'application/json',
                  ...(payloadStr ? { 'Content-Length': Buffer.byteLength(payloadStr) } : {}),
                },
              }, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  if (res.statusCode >= 400) return reject(new Error(`HTTP ${res.statusCode} ${method} ${urlPath}: ${data}`));
                  resolve(data ? JSON.parse(data) : null);
                });
              });
              req.on('error', reject);
              if (payloadStr) req.write(payloadStr);
              req.end();
            });
          }

          (async () => {
            const appsResp = await apiRequest('GET', '/v1/apps?filter[bundleId]=com.betelcode.app');
            const appId = appsResp.data[0].id;
            console.log(`App id: ${appId}`);

            const existing = await apiRequest('GET', `/v1/apps/${appId}/appStoreVersions?filter[versionString]=${VERSION_STRING}&filter[platform]=IOS`);
            let versionId;
            if (existing.data.length > 0) {
              versionId = existing.data[0].id;
              console.log(`Version ${VERSION_STRING} already exists: ${versionId}`);
            } else {
              const created = await apiRequest('POST', '/v1/appStoreVersions', {
                data: {
                  type: 'appStoreVersions',
                  attributes: { platform: 'IOS', versionString: VERSION_STRING, releaseType: 'MANUAL' },
                  relationships: { app: { data: { type: 'apps', id: appId } } },
                },
              });
              versionId = created.data.id;
              console.log(`Created version ${VERSION_STRING}: ${versionId}`);
            }

            const buildsResp = await apiRequest('GET', `/v1/builds?filter[app]=${appId}&filter[processingState]=VALID&sort=-uploadedDate&limit=1`);
            if (buildsResp.data.length === 0) throw new Error('No VALID build found to attach');
            const buildId = buildsResp.data[0].id;
            console.log(`Latest VALID build: ${buildId} (version ${buildsResp.data[0].attributes.version})`);

            await apiRequest('PATCH', `/v1/appStoreVersions/${versionId}/relationships/build`, {
              data: { type: 'builds', id: buildId },
            });
            console.log(`Attached build ${buildId} to version ${versionId}`);
          })().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          EOF
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Clean up secrets from disk
        if: always()
        run: rm -f AuthKey.p8

  build-and-upload:
    if: ${{ github.event.inputs.mode == 'build' || github.event.inputs.mode == '' }}
    runs-on: macos-26
    env:
      EXPO_PUBLIC_PROJECT_ID: 361b27c1-4d2d-4a5f-b231-00456d27d148
      EXPO_PUBLIC_IOS_GOOGLE_SERVICES_FILE: ./GoogleService-Info.plist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write GoogleService-Info.plist
        run: echo "$IOS_GOOGLE_SERVICES_PLIST" > GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          echo "$ASC_API_KEY" > AuthKey.p8
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Determine workspace and scheme
        id: xcode
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              const json = JSON.parse(data);
              console.log(json.workspace.schemes.find(s => !s.includes('Tests')) || json.workspace.schemes[0]);
            });
          ")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"

      - name: Write export options plist
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>BUX5F295HS</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="BUX5F295HS" \
            CODE_SIGN_STYLE="Automatic"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'

      - name: Upload to App Store Connect
        run: |
          IPA_PATH=$(find build/ipa -maxdepth 1 -name "*.ipa" | head -1)
          echo "Uploading $IPA_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Clean up secrets from disk
        if: always()
        run: rm -f AuthKey.p8 GoogleService-Info.plist && rm -rf ~/.appstoreconnect

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ios-appstore-ipa
          path: build/ipa/*.ipa
          retention-days: 7
