name: Android Play Store Release Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build (full assemble+upload) or check (list tracks + version codes)'
        type: choice
        options: [build, check]
        default: check

jobs:
  check:
    if: ${{ github.event.inputs.mode == 'check' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write service account key
        run: echo "$GOOGLE_PLAY_KEY" > play-service-account.json
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Query tracks and version codes
        run: |
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const https = require('https');

          const PACKAGE_NAME = 'com.betelcode.app';
          const key = JSON.parse(fs.readFileSync('play-service-account.json', 'utf8'));

          function base64url(buf) {
            return buf.toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          function postForm(hostname, urlPath, formBody) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname, path: urlPath, method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Content-Length': Buffer.byteLength(formBody) },
              }, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  if (res.statusCode >= 400) return reject(new Error(`HTTP ${res.statusCode}: ${data}`));
                  resolve(JSON.parse(data));
                });
              });
              req.on('error', reject);
              req.write(formBody);
              req.end();
            });
          }

          function apiRequest(method, urlPath, accessToken, body) {
            return new Promise((resolve, reject) => {
              const payloadStr = body ? JSON.stringify(body) : null;
              const req = https.request({
                hostname: 'androidpublisher.googleapis.com',
                path: urlPath,
                method,
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  'Content-Type': 'application/json',
                  ...(payloadStr ? { 'Content-Length': Buffer.byteLength(payloadStr) } : {}),
                },
              }, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  if (res.statusCode >= 400) return reject(new Error(`HTTP ${res.statusCode} ${method} ${urlPath}: ${data}`));
                  resolve(data ? JSON.parse(data) : null);
                });
              });
              req.on('error', reject);
              if (payloadStr) req.write(payloadStr);
              req.end();
            });
          }

          async function getAccessToken() {
            const now = Math.floor(Date.now() / 1000);
            const header = { alg: 'RS256', typ: 'JWT' };
            const payload = {
              iss: key.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            };
            const headerB64 = base64url(Buffer.from(JSON.stringify(header)));
            const payloadB64 = base64url(Buffer.from(JSON.stringify(payload)));
            const signingInput = `${headerB64}.${payloadB64}`;
            const signature = crypto.sign('RSA-SHA256', Buffer.from(signingInput), key.private_key);
            const jwt = `${signingInput}.${base64url(signature)}`;

            const formBody = `grant_type=${encodeURIComponent('urn:ietf:params:oauth:grant-type:jwt-bearer')}&assertion=${jwt}`;
            const tokenResp = await postForm('oauth2.googleapis.com', '/token', formBody);
            return tokenResp.access_token;
          }

          (async () => {
            const accessToken = await getAccessToken();
            console.log('Got access token.');

            const edit = await apiRequest('POST', `/androidpublisher/v3/applications/${PACKAGE_NAME}/edits`, accessToken, {});
            const editId = edit.id;
            console.log(`Edit id: ${editId}`);

            const tracksResp = await apiRequest('GET', `/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${editId}/tracks`, accessToken);
            for (const track of tracksResp.tracks || []) {
              console.log(`\n=== Track: ${track.track} ===`);
              for (const release of track.releases || []) {
                console.log(`  release "${release.name || '(sem nome)'}" status=${release.status} versionCodes=${(release.versionCodes || []).join(',')}`);
              }
            }
          })().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          EOF

      - name: Clean up secrets from disk
        if: always()
        run: rm -f play-service-account.json

  build-and-upload:
    if: ${{ github.event.inputs.mode == 'build' }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_PROJECT_ID: 361b27c1-4d2d-4a5f-b231-00456d27d148
      EXPO_PUBLIC_ANDROID_GOOGLE_SERVICES_FILE: ./google-services.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write google-services.json
        run: echo "$ANDROID_GOOGLE_SERVICES_JSON" > google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Write release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/betelcode-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Write Google Play service account key
        run: echo "$GOOGLE_PLAY_KEY" > play-service-account.json
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Publish to Play Store (closed testing)
        run: node scripts/play-publish.js
        env:
          GOOGLE_PLAY_KEY_PATH: play-service-account.json
          PACKAGE_NAME: com.betelcode.app
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          TRACK: alpha
          VERSION_CODE: '4'
          RELEASE_NAME: '4.7.0'
          RELEASE_NOTES_PT_BR: |
            Nesta versão:

            • Nova tela de Status dos Agentes (para administradores): veja quem está online, offline e o último acesso de cada um.
            • Corrigido um problema que podia interromper o recebimento de notificações push após um tempo de uso.
            • Ajustes de estabilidade e de interface.

      - name: Clean up secrets from disk
        if: always()
        run: rm -f play-service-account.json google-services.json android/app/betelcode-release.keystore

      - name: Upload AAB artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
