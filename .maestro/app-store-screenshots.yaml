appId: com.betelcode.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-email-input"
- inputText: "${DEMO_EMAIL}"
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: "${DEMO_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- repeat:
    times: 20
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tab-conversations"
          timeout: 2000
          optional: true
- tapOn:
    id: "tab-conversations"
- repeat:
    times: 10
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      - tapOn:
          id: "tab-conversations"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "conversation-item"
          timeout: 2000
          optional: true
- takeScreenshot: 01_conversations
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    id: "conversation-item"
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      - waitForAnimationToEnd
- takeScreenshot: 02_chat
- back
- tapOn:
    id: "tab-contacts"
- waitForAnimationToEnd
- takeScreenshot: 03_contacts
- tapOn:
    id: "tab-settings"
- waitForAnimationToEnd
- takeScreenshot: 04_settings
